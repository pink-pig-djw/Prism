name: 构建应用

# 推送代码时自动构建 Windows / macOS / Linux / 安卓 安装包，可在 Actions 页面下载。
# 发布正式版本（会出现在 GitHub Releases，已安装的 Windows 版据此自动更新）有两种方式：
#   1. 推送 v 开头的标签，例如 v0.2.0；
#   2. 在 Actions 页面手动运行本流程，填写版本号（例如 0.2.0），流程会自动创建标签并发布。
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      release:
        description: "要发布的版本号（例如 0.2.0）；留空则只构建、不发布"
        required: false
        default: ""

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # electron-builder 会自己下载打包用的 Electron，安装依赖时不需要再下载一次
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  # 本次要发布的版本号（来自标签或手动运行时填写的版本号），为空表示不发布
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.release || '') }}

jobs:
  web:
    name: 网页版检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  desktop:
    name: 桌面版 (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win
          - name: macOS
            os: macos-latest
            args: --mac
          - name: Linux
            os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 发布正式版本（推送 v 开头的标签）时，用标签作为版本号，自动更新靠它判断新旧
      - name: 设置版本号
        if: env.RELEASE_VERSION != ''
        shell: bash
        run: npm version "${RELEASE_VERSION#v}" --no-git-tag-version --allow-same-version
      - run: npm run build:desktop
      - name: 打包安装包
        run: node scripts/dist-desktop.mjs ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Prism-${{ matrix.name }}
          # latest.yml 和 .blockmap 是 Windows 自动更新需要的文件
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  android:
    name: 安卓版
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: 设置版本号
        if: env.RELEASE_VERSION != ''
        run: npm version "${RELEASE_VERSION#v}" --no-git-tag-version --allow-same-version
      - run: npm run build:android
      # 在仓库 Settings → Secrets 中配置 ANDROID_KEYSTORE_BASE64 等变量后，会用你自己的证书签名；
      # 否则使用临时的调试证书签名（同样可以安装，但覆盖升级时需要先卸载旧版）
      - name: 准备签名证书
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "使用仓库配置的签名证书"
          else
            echo "未配置签名证书，使用调试证书"
          fi
      - name: 构建 APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: 整理文件名
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Prism-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Prism-Android
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: 发布到 Releases
    # job 级别的 if 里不能用 env，这里重复一遍判断条件
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')'
    needs: [web, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 整理版本号
        id: version
        run: echo "version=${RELEASE_VERSION#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # 标签不存在时会在本次构建的提交上自动创建
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Prism v${{ steps.version.outputs.version }}
          files: artifacts/*
          generate_release_notes: true
